version: '3.8'

services:
  # MySQL 데이터베이스
  db:
    container_name: db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  # Prometheus (메트릭 수집)
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 운영 서버의 MANAGEMENT_SCRAPE_TOKEN 과 같은 값을 한 줄로 적은 파일. 저장소에는 올리지 않는다(.gitignore).
      # 짧은 문법으로 적으면 파일이 없을 때 같은 이름의 빈 디렉터리가 생겨 Prometheus 가 뜬 채로 수집만 조용히 실패한다.
      # create_host_path: false 로 두어 파일이 없으면 컨테이너를 만들지 않고 바로 실패하게 한다.
      - type: bind
        source: ./prometheus-scrape-token
        target: /etc/prometheus/scrape-token
        read_only: true
        bind:
          create_host_path: false
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    depends_on:
      - db

  # Grafana (대시보드)
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  grafana-storage:
