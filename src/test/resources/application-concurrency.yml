# 실제 MySQL 테스트 전용 프로필(@ActiveProfiles("concurrency")). 로컬 Docker MySQL(mysql:8.0)에만 붙는다.
# 운영·개발 DB 로 새지 않도록 호스트를 127.0.0.1 로 고정하고, LocalMySqlTest 가 URL 과 스키마 이름을 한 번 더 확인한다.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${CONCURRENCY_DB_PORT:3307}/${CONCURRENCY_DB_NAME:mansereok_test}?zeroDateTimeBehavior=CONVERT_TO_NULL
    username: root
    password: root
  jpa:
    hibernate:
      # 로컬 테스트 DB 한정. 운영은 validate 이고 스키마는 손으로 적용한다.
      # 이 스키마에는 manses 기초 데이터가 들어 있으므로 create·create-drop 을 쓰지 않는다.
      ddl-auto: update
    show-sql: false
  sql:
    init:
      # 스프링 부트 기본값(embedded)에서도 MySQL 에는 schema.sql 을 돌리지 않는다. 그래도 누가 기본 설정을 always 로 바꾸더라도
      # 이 프로필에서는 참고용 DDL 인 schema.sql 을 이미 표가 있는 테스트 DB 에 다시 돌리지 않도록 못 박아 둔다.
      mode: never

# application.yml 의 기본값 없는 자리표시자를 같은 이름의 최상위 키로 채운다. 환경변수 없이 이 파일만으로 애플리케이션이 뜬다.
# Discord·Slack·SES·S3 는 LocalMySqlTest 가 목으로 바꾸므로 아래 주소로 실제 호출이 나가지 않는다.
AWS_ACCESS_KEY_ID: concurrency-test-aws-access-key
AWS_SECRET_ACCESS_KEY: concurrency-test-aws-secret-key
AWS_SES_ACCESS_KEY: concurrency-test-ses-access-key
AWS_SES_SECRET_KEY: concurrency-test-ses-secret-key
DISCORD_SIGNUP_URL: http://localhost/discord-test
DISCORD_SIGNUP_URL_2: http://localhost/discord-test
DISCORD_PAYMENT_URL: http://localhost/discord-test
DISCORD_INTERPRET_URL: http://localhost/discord-test
SLACK_WEBHOOK_URL: http://localhost/slack-test
GEMINI_API_KEY: concurrency-test-gemini-key
OPENAI_API_KEY: concurrency-test-openai-key
# JwtProperties 가 32자 이상을 요구한다.
JWT_SECRET_KEY: concurrency-test-jwt-secret-0123456789abcdef
GOOGLE_OAUTH_CLIENT_ID: concurrency-test
GOOGLE_OAUTH_CLIENT_SECRET: concurrency-test
GOOGLE_OAUTH_REDIRECT_URI: http://localhost/oauth-test
KAKAO_OAUTH_CLIENT_ID: concurrency-test
KAKAO_OAUTH_REDIRECT_URI: http://localhost/oauth-test
NAVER_OAUTH_CLIENT_ID: concurrency-test
NAVER_OAUTH_CLIENT_SECRET: concurrency-test
NAVER_OAUTH_REDIRECT_URI: http://localhost/oauth-test
X_OAUTH_CLIENT_ID: concurrency-test
X_OAUTH_CLIENT_SECRET: concurrency-test
X_OAUTH_REDIRECT_URI: http://localhost/oauth-test
PORTONE_API_SECRET: concurrency-test-portone-secret
# 포트원 SDK 의 WebhookVerifier 는 whsec_ 뒤를 base64 로 풀어 쓴다. 검증기를 기동 때 만드는 코드도 뜨도록 그 형식을 지킨다.
PORTONE_WEBHOOK_SECRET: whsec_Y29uY3VycmVuY3ktdGVzdC13ZWJob29rLXNlY3JldA==

# 아래 두 키는 application.yml 에 없어 환경변수(APP_FRONTENDURL, PORTONE_WEBHOOK_SECRET)로만 채워지던 값이다.
# portone.webhook.secret 은 @Value 로 이 키를 읽는 PaymentController 를 위해 둔다. app.frontend-url 은 EmailService 가 읽으며,
# LocalMySqlTest 는 EmailService 를 목으로 바꾸지만 진짜 EmailService 를 쓰는 테스트를 위해 둔다.
app:
  frontend-url: http://localhost:3000

portone:
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET}

logging:
  level:
    org.springframework.security: INFO
