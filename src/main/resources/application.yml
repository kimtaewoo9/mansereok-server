spring:
  application:
    name: mansereok-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mysql}?zeroDateTimeBehavior=CONVERT_TO_NULL
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

## S3 bucket
aws:
  s3:
    bucket-name: named-og-image
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ap-northeast-2

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI} # 나중에 실제 서비스 uri로 바꿔야함 .
  kakao:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI}
  naver:
    client-id: ${NAVER_OAUTH_CLIENT_ID}
    client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
    redirect-uri: ${NAVER_OAUTH_REDIRECT_URI}
  x:
    client-id: ${X_OAUTH_CLIENT_ID}
    client-secret: ${X_OAUTH_CLIENT_SECRET}
    redirect-uri: ${X_OAUTH_REDIRECT_URI}
  
  # X(트위터)

# OpenAI API
openai:
  api:
    key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com

# Gemini API
gemini:
  api:
    key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/models

# 만세력 불러올 API
posteller:
  api:
    base-url: https://api.forceteller.com

# swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# JWT
app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token-expiration: 1800000
    refresh-token-expiration: 2592000000
    issuer: "www.namedsaju.com"

server:
  port: 8080

portone:
  api:
    secret: ${PORTONE_API_SECRET}  # 포트원 콘솔에서 발급받은 V2 API Secret
    webhook:
      secret: ${PORTONE_WEBHOOK_SECRET}

# 결제 관련 설정
payment:
  free-event:
    # 가격이 0원이 아니지만 이벤트로 무료 제공하는 SubCategory id 목록 (쉼표 구분). 비우면 가격 0원 상품만 무료.
    sub-category-ids: ${PAYMENT_FREE_EVENT_SUB_CATEGORY_IDS:}

logging:
  level:
    org.springframework.security: DEBUG

# Slack
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

# Discord
discord:
  webhook:
    signup-url: ${DISCORD_SIGNUP_URL}
    signup-url-channel2: ${DISCORD_SIGNUP_URL_2}
    payment-url: ${DISCORD_PAYMENT_URL}
    interpretation-request-url: ${DISCORD_INTERPRET_URL}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,metrics"  # ← prometheus, metrics 추가
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: dev
