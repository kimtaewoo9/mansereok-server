spring:
  application:
    name: mansereok-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mysql}?zeroDateTimeBehavior=CONVERT_TO_NULL
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    # 영속성 컨텍스트와 DB 커넥션을 요청이 끝날 때까지 붙잡아 두지 않는다(open-in-view 끔). 트랜잭션이 끝나면 커넥션을 풀에
    # 돌려주므로, 트랜잭션이 완전히 끝난 뒤의 외부 호출(예: 결제 스택의 환불에서 커밋 뒤 부르는 포트원 취소)을 기다리는 동안에는
    # 커넥션을 쥐지 않는다. AFTER_COMMIT 리스너 안의 호출은 트랜잭션 정리 전이라 여전히 커넥션을 쥔다(UserNotificationListener 참고).
    # 대신 트랜잭션 밖에서 엔티티의 지연 로딩 연관을 읽으면 LazyInitializationException 이 난다. 필요한 연관은 서비스의 트랜잭션
    # 안에서 읽어 둔다.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

## S3 bucket
aws:
  s3:
    bucket-name: named-og-image
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ap-northeast-2

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI} # 나중에 실제 서비스 uri로 바꿔야함 .
  kakao:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI}
  naver:
    client-id: ${NAVER_OAUTH_CLIENT_ID}
    client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
    redirect-uri: ${NAVER_OAUTH_REDIRECT_URI}
  x:
    client-id: ${X_OAUTH_CLIENT_ID}
    client-secret: ${X_OAUTH_CLIENT_SECRET}
    redirect-uri: ${X_OAUTH_REDIRECT_URI}
  
  # X(트위터)

# OpenAI API
openai:
  api:
    key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com

# Gemini API
gemini:
  api:
    key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/models

# 만세력 불러올 API
posteller:
  api:
    base-url: https://api.forceteller.com

# swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# JWT
app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token-expiration: 1800000
    # 7일(밀리초). DB 의 토큰 만료와 리프레시 쿠키의 Max-Age 가 모두 이 값을 따른다.
    refresh-token-expiration: 604800000
    issuer: "www.namedsaju.com"
  # 브라우저에서 이 API 를 부를 수 있는 프론트엔드 출처. 쿠키를 싣는 요청을 받으므로 와일드카드 없이 정확한 주소만 적는다.
  # 프로필 없이 띄운 로컬 서버는 로컬 프론트엔드만 받는다. dev·prod 프로필은 각자의 yml 에 적힌 목록으로 이 값을 덮어쓴다.
  cors:
    allowed-origins:
      - http://localhost:3000

server:
  port: 8080

portone:
  api:
    secret: ${PORTONE_API_SECRET}  # 포트원 콘솔에서 발급받은 V2 API Secret
    webhook:
      secret: ${PORTONE_WEBHOOK_SECRET}

# 결제 관련 설정
payment:
  webhook:
    url: ${PAYMENT_WEBHOOK_URL:https://api/namedsaju.com/api/payment/webhook}  # 포트원 웹훅 URL
  test-mode: ${PAYMENT_TEST_MODE:true}  # 테스트 모드 여부

# 상품 가격 설정 (원화)
product:
  prices:
    saju-basic: 10000      # 기본 사주 해석
    saju-detail: 30000     # 상세 사주 해석
    compatibility: 20000   # 궁합 분석
    monthly-pass: 50000    # 월간 이용권
    yearly-pass: 300000    # 연간 이용권

logging:
  level:
    org.springframework.security: DEBUG

# Slack
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

# Discord
discord:
  webhook:
    signup-url: ${DISCORD_SIGNUP_URL}
    signup-url-channel2: ${DISCORD_SIGNUP_URL_2}
    payment-url: ${DISCORD_PAYMENT_URL}
    interpretation-request-url: ${DISCORD_INTERPRET_URL}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,metrics"  # ← prometheus, metrics 추가
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: dev
