global:
  scrape_interval: 15s  # 15초마다 메트릭 수집

scrape_configs:
  # 운영 서버(namedsaju.com)의 지표. 서버는 수집 토큰이 없는 요청을 401 로 막는다.
  # 토큰은 서버 환경변수 MANAGEMENT_SCRAPE_TOKEN 과 같은 값을 한 줄로 적은 파일에서 읽는다. docker-compose.yml 이 저장소 루트의
  # prometheus-scrape-token 파일을 아래 경로에 붙인다. 이 파일은 .gitignore 에 있어 저장소에 올라가지 않는다.
  - job_name: 'mansereok-prod'
    scheme: https
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets: [ 'namedsaju.com' ]
